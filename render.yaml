services:
  - type: web
    name: nic-fleethub
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn server:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRODUCTION
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nic-fleethub.vercel.app,http://localhost:3000"
